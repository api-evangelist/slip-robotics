aid: slip-robotics
name: Slip Robotics
description: >-
  Slip Robotics is an Atlanta, Georgia-based robotics company that builds
  SlipBots, autonomous omnidirectional Automated Loading Robots (ALRs) that load
  and unload any truck trailer in about five minutes without a forklift ever
  entering the trailer. Each SlipBot carries up to eight pallets and roughly six
  tons, cutting driver dwell time from around ninety minutes to five while
  reducing material-handling damage and loading-dock accidents. The company also
  offers SlipLift, a platform that extends autonomous trailer loading and
  unloading to heavier freight and regional and last-mile routes. Slip Robotics
  markets its robots-as-a-service offering as requiring no IT integration, is
  backed by DCVC, and won Best New Innovation in supply chain technology at
  MODEX 2024. It is tracked in the API Evangelist network as a company profile;
  no public developer API surface was found during enrichment.
